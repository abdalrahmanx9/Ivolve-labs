apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapp
  namespace: ivolve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demoapp
  template:
    metadata:
      labels:
        app: demoapp
    spec:
      containers:
        - name: demoapp
          image: abdalrahmanx/ivolve-demoapp:3
          ports:
            - containerPort: 8080
